<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Viewer - HexBuzz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }
        h1 { color: #4ec9b0; margin-bottom: 20px; font-size: 24px; }

        .controls {
            background: #252526;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
        }
        button:hover { background: #1177bb; }
        button.secondary { background: #3c3c3c; }
        button.secondary:hover { background: #505050; }
        button.active { background: #388a34; }
        button.danger { background: #6e1b1b; }
        button.danger:hover { background: #8b2222; }

        select, input {
            background: #3c3c3c;
            color: #d4d4d4;
            border: 1px solid #555;
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 13px;
        }
        select { min-width: 100px; }
        input { flex: 1; max-width: 250px; }

        .status-bar {
            background: #252526;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            display: flex;
            gap: 25px;
            align-items: center;
            font-size: 13px;
        }
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .status-dot.connected { background: #3fb950; }
        .status-dot.disconnected { background: #f85149; }
        .stat-label { color: #858585; }
        .stat-value { color: #4ec9b0; font-weight: bold; }

        .log-table-wrap {
            background: #252526;
            border-radius: 4px;
            overflow: auto;
            max-height: calc(100vh - 240px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead { position: sticky; top: 0; z-index: 1; }
        th {
            background: #333;
            color: #858585;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #444;
        }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid #333;
            vertical-align: top;
        }
        tr:hover { background: #2a2d2e; }

        .time { color: #858585; white-space: nowrap; font-size: 12px; }
        .event { color: #dcdcaa; }
        .session { color: #608b4e; font-size: 12px; }
        .data-cell {
            max-width: 500px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #ce9178;
            font-size: 12px;
            cursor: pointer;
        }
        .data-cell.expanded {
            white-space: pre-wrap;
            word-break: break-all;
        }

        .level-badge {
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .level-debug { background: #2d2d2d; color: #858585; }
        .level-info  { background: #264f78; color: #4fc1ff; }
        .level-warn  { background: #4d3800; color: #f9c513; }
        .level-error { background: #4b1e1e; color: #f85149; }

        .empty {
            padding: 40px;
            text-align: center;
            color: #858585;
        }
        .tabs {
            display: flex;
            gap: 2px;
            margin-bottom: 15px;
        }
        .tab {
            background: #2d2d2d;
            color: #858585;
            padding: 8px 20px;
            border-radius: 4px 4px 0 0;
            cursor: pointer;
            border: none;
            font-family: inherit;
            font-size: 13px;
        }
        .tab.active { background: #252526; color: #d4d4d4; }
        .tab:hover { color: #d4d4d4; }

        .files-list { background: #252526; border-radius: 4px; padding: 15px; }
        .file-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #333;
            align-items: center;
        }
        .file-item:last-child { border-bottom: none; }
        .file-name { color: #4fc1ff; }
        .file-size { color: #858585; font-size: 12px; }
        .file-date { color: #858585; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Log Viewer - HexBuzz</h1>

        <div class="controls">
            <select id="levelFilter">
                <option value="">All Levels</option>
                <option value="debug">Debug</option>
                <option value="info">Info</option>
                <option value="warn">Warn</option>
                <option value="error">Error</option>
            </select>
            <input type="text" id="eventFilter" placeholder="Filter by event...">
            <button id="streamBtn" onclick="toggleStream()">Connect Stream</button>
            <button class="secondary" onclick="fetchLogs()">Load History</button>
            <button id="scrollBtn" class="secondary active"
                    onclick="toggleAutoScroll()">Auto-scroll: ON</button>
            <button class="danger" onclick="clearLogs()">Clear All</button>
            <button class="secondary" onclick="clearDisplay()">Clear Display</button>
        </div>

        <div class="status-bar">
            <span>
                <span id="statusDot" class="status-dot disconnected"></span>
                <span id="statusText">Disconnected</span>
            </span>
            <span>
                <span class="stat-label">Entries: </span>
                <span class="stat-value" id="entryCount">0</span>
            </span>
            <span>
                <span class="stat-label">Errors: </span>
                <span class="stat-value" id="errorCount" style="color:#f85149">0</span>
            </span>
            <span>
                <span class="stat-label">Warnings: </span>
                <span class="stat-value" id="warnCount" style="color:#f9c513">0</span>
            </span>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('live')">Live Logs</button>
            <button class="tab" onclick="showTab('files')">Log Files</button>
        </div>

        <div id="liveTab">
            <div class="log-table-wrap" id="logWrap">
                <table>
                    <thead>
                        <tr>
                            <th style="width:160px">Time</th>
                            <th style="width:70px">Level</th>
                            <th style="width:200px">Event</th>
                            <th style="width:100px">Session</th>
                            <th>Data</th>
                        </tr>
                    </thead>
                    <tbody id="logBody">
                        <tr><td colspan="5" class="empty">
                            No logs yet. Click "Connect Stream" for real-time logs
                            or "Load History" for persisted entries.
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="filesTab" style="display:none">
            <div class="files-list" id="filesList">
                <div class="empty">Loading log files...</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let eventSource = null;
        let autoScroll = true;
        let entries = [];
        let totalErrors = 0;
        let totalWarns = 0;

        function getFilterLevel() {
            return document.getElementById('levelFilter').value;
        }
        function getFilterEvent() {
            return document.getElementById('eventFilter').value.trim().toLowerCase();
        }

        function matchesFilter(entry) {
            const level = getFilterLevel();
            const evt = getFilterEvent();
            if (level && entry.level !== level) return false;
            if (evt && !(entry.event || '').toLowerCase().includes(evt)) return false;
            return true;
        }

        function toggleStream() {
            if (eventSource) {
                disconnectStream();
            } else {
                connectStream();
            }
        }

        function connectStream() {
            if (eventSource) return;
            eventSource = new EventSource(API_BASE + '/api/logs/stream');

            eventSource.onopen = function() {
                document.getElementById('statusDot').className = 'status-dot connected';
                document.getElementById('statusText').textContent = 'Connected';
                document.getElementById('streamBtn').textContent = 'Disconnect';
                document.getElementById('streamBtn').className = 'active';
            };

            eventSource.onmessage = function(e) {
                try {
                    var entry = JSON.parse(e.data);
                    addEntry(entry);
                } catch (err) {
                    console.error('Failed to parse SSE data:', err);
                }
            };

            eventSource.onerror = function() {
                document.getElementById('statusDot').className = 'status-dot disconnected';
                document.getElementById('statusText').textContent = 'Reconnecting...';
            };
        }

        function disconnectStream() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
            document.getElementById('statusDot').className = 'status-dot disconnected';
            document.getElementById('statusText').textContent = 'Disconnected';
            document.getElementById('streamBtn').textContent = 'Connect Stream';
            document.getElementById('streamBtn').className = '';
        }

        function addEntry(entry) {
            entries.push(entry);
            if (entry.level === 'error') totalErrors++;
            if (entry.level === 'warn') totalWarns++;
            updateStats();

            if (matchesFilter(entry)) {
                appendRow(entry);
            }
        }

        function appendRow(entry) {
            var body = document.getElementById('logBody');
            if (body.querySelector('.empty')) {
                body.innerHTML = '';
            }

            var tr = document.createElement('tr');
            var time = new Date(entry.timestamp).toLocaleTimeString(
                'en-US', {hour12: false, hour:'2-digit', minute:'2-digit',
                          second:'2-digit', fractionalSecondDigits: 3});
            var date = new Date(entry.timestamp).toLocaleDateString('en-US',
                {month:'short', day:'numeric'});
            var levelClass = 'level-' + (entry.level || 'info');
            var sessionShort = (entry.sessionId || '').slice(-8);
            var dataStr = entry.data ? JSON.stringify(entry.data) : '';

            tr.innerHTML =
                '<td class="time">' + escapeHtml(date + ' ' + time) + '</td>' +
                '<td><span class="level-badge ' + levelClass + '">' +
                    escapeHtml(entry.level || 'info') + '</span></td>' +
                '<td class="event">' + escapeHtml(entry.event || '') + '</td>' +
                '<td class="session">' + escapeHtml(sessionShort) + '</td>' +
                '<td class="data-cell" onclick="this.classList.toggle(\'expanded\')"' +
                    ' title="Click to expand">' + escapeHtml(dataStr) + '</td>';
            body.appendChild(tr);

            if (autoScroll) {
                var wrap = document.getElementById('logWrap');
                wrap.scrollTop = wrap.scrollHeight;
            }
        }

        function updateStats() {
            document.getElementById('entryCount').textContent = entries.length;
            document.getElementById('errorCount').textContent = totalErrors;
            document.getElementById('warnCount').textContent = totalWarns;
        }

        function toggleAutoScroll() {
            autoScroll = !autoScroll;
            var btn = document.getElementById('scrollBtn');
            btn.textContent = 'Auto-scroll: ' + (autoScroll ? 'ON' : 'OFF');
            btn.className = autoScroll ? 'secondary active' : 'secondary';
        }

        function fetchLogs() {
            var level = getFilterLevel();
            var evt = getFilterEvent();
            var url = API_BASE + '/api/logs/?limit=500';
            if (level) url += '&level=' + encodeURIComponent(level);
            if (evt) url += '&event=' + encodeURIComponent(evt);

            fetch(url)
                .then(function(resp) { return resp.json(); })
                .then(function(data) {
                    if (data.success && data.logs) {
                        clearDisplay();
                        var ordered = data.logs.slice().reverse();
                        ordered.forEach(function(entry) { addEntry(entry); });
                    }
                })
                .catch(function(err) {
                    console.error('Failed to fetch logs:', err);
                });
        }

        function clearLogs() {
            if (!confirm('Delete all persisted and buffered logs?')) return;
            fetch(API_BASE + '/api/logs/', {method: 'DELETE'})
                .then(function() { clearDisplay(); })
                .catch(function(err) { console.error('Failed to clear logs:', err); });
        }

        function clearDisplay() {
            entries = [];
            totalErrors = 0;
            totalWarns = 0;
            updateStats();
            document.getElementById('logBody').innerHTML =
                '<tr><td colspan="5" class="empty">No log entries</td></tr>';
        }

        function showTab(name) {
            document.querySelectorAll('.tab').forEach(function(t) {
                t.classList.remove('active');
            });
            document.getElementById('liveTab').style.display =
                name === 'live' ? '' : 'none';
            document.getElementById('filesTab').style.display =
                name === 'files' ? '' : 'none';
            event.target.classList.add('active');
            if (name === 'files') loadFiles();
        }

        function loadFiles() {
            var container = document.getElementById('filesList');
            fetch(API_BASE + '/api/logs/files')
                .then(function(resp) { return resp.json(); })
                .then(function(data) {
                    if (!data.success || !data.files || data.files.length === 0) {
                        container.innerHTML =
                            '<div class="empty">No log files found</div>';
                        return;
                    }
                    container.innerHTML = data.files.map(function(f) {
                        var size = f.sizeBytes < 1024
                            ? f.sizeBytes + ' B'
                            : (f.sizeBytes / 1024).toFixed(1) + ' KB';
                        var modified = new Date(f.modified).toLocaleString();
                        return '<div class="file-item">' +
                            '<span class="file-name">' +
                                escapeHtml(f.filename) + '</span>' +
                            '<span class="file-size">' + size + '</span>' +
                            '<span class="file-date">' + modified + '</span>' +
                            '<a href="' + API_BASE + '/api/logs/files/' +
                                encodeURIComponent(f.filename) +
                                '" target="_blank" ' +
                                'style="color:#4fc1ff;text-decoration:none">' +
                                'Download</a>' +
                            '</div>';
                    }).join('');
                })
                .catch(function() {
                    container.innerHTML =
                        '<div class="empty">Failed to load files</div>';
                });
        }

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        document.getElementById('levelFilter').addEventListener('change', refilter);
        document.getElementById('eventFilter').addEventListener('input', refilter);

        function refilter() {
            var body = document.getElementById('logBody');
            body.innerHTML = '';
            var visible = 0;
            entries.forEach(function(entry) {
                if (matchesFilter(entry)) {
                    appendRow(entry);
                    visible++;
                }
            });
            if (visible === 0) {
                body.innerHTML =
                    '<tr><td colspan="5" class="empty">No matching entries</td></tr>';
            }
        }
    </script>
</body>
</html>
